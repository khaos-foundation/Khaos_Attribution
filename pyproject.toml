[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khaos_attribution"
version = "0.39.1"
description = "JSON schemas and validators for artist attribution: provenance records and model cards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-Khaos-Free-Use: free to use, not open source; see LICENSE" }
authors = [{ name = "Khaos Foundation Limited" }]
dependencies = [
    "jsonschema>=4.18",
    # blend.py and embedding.py: the estimator math and embedding contract
    # are shared by the Workshop and the Listening Space — one
    # implementation, versioned with the schemas it feeds.
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "soundfile>=0.12", "pillow>=10"]  # fingerprint survival tests decode real audio; the seal-on-artwork tests read pixels
# Placing the seal on hero artwork reads the artwork's pixels; the seal renderers themselves need nothing.
artwork = ["pillow>=10"]
# gradient.py: features of a live training module; the engine itself is found at run time.
gradient = ["torch>=2.2"]
# registry.py: Ed25519 for machine keys and the register's countersignature.
registry = ["cryptography>=42"]
# credentials.py: Content Credentials (C2PA) signed into every output.
credentials = ["c2pa-python>=0.38; python_version >= '3.10'", "cryptography>=42"]
# verify.py: the khaos-verify command reads the record and fingerprints the audio; `detector` adds the watermark.
verify = ["soundfile>=0.12", "c2pa-python>=0.38; python_version >= '3.10'", "cryptography>=42"]
# A room (the Workshop, a Space): the register client, Content Credentials and the verifier, in one word.
rooms = ["cryptography>=42", "soundfile>=0.12", "c2pa-python>=0.38; python_version >= '3.10'"]
detector = ["audioseal>=0.2", "torch>=2.2", "torchaudio>=2.2"]
# register_service: the register itself, on its own machine.
# The soft-binding lookup decodes uploaded audio to fingerprint it.
service = ["cryptography>=42", "fastapi>=0.110", "uvicorn>=0.27", "soundfile>=0.12", "numpy>=1.24"]

[project.scripts]
khaos-verify = "khaos_attribution.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khaos_attribution = ["schemas/*.json", "engines/*.json", "engines/*/engine.json", "legacy_watermark_ids.json", "watermark_resets.json",
                     "seal/glyphs.json", "seal/star.svg", "seal/OFL.txt", "seal/SPEC.md",
                     "seal/assets/*.svg"]
