name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # A fresh runner venv; uv.lock still records an older version of this package, so --frozen, not --locked.
      - run: uv sync --frozen --extra test
      - run: .venv/bin/python -m pytest -q -rs
