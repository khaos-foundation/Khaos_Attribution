name: tests

on:
  # A pull request runs the suite; merging it when green needs no second run on main.
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      # A fresh runner venv from the lock as committed; tests/test_version.py holds the lock to pyproject's version.
      # Every extra the register, the log, the registry and the credentials tests import; torch stays out, and the
      # suite itself fails on a skip it does not expect (tests/conftest.py).
      - run: uv sync --frozen --extra test --extra service --extra registry --extra credentials
      - run: .venv/bin/python -m pytest -q -rs
